spring.application.name=gateway-svc
server.port=8888

# we created the discovery service
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# because we haven't created the config service yet, and we still added config dependency
spring.cloud.config.enabled=false

# expose all actuator endpoints by default only health is exposed
management.endpoints.web.exposure.include=*

# Lower case svc name
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true